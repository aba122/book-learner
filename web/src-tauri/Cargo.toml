[package]
name = "book-learner"
version = "0.1.0"
description = "攻书 macOS desktop application"
authors = ["book-learner contributors"]
edition = "2021"

[lib]
name = "book_learner_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
chrono = "0.4"
tauri-build = { version = "2", features = [] }

[dependencies]
book_learner_core = { path = "../../core" }
chrono = "0.4"
rfd = { version = "0.16", default-features = false }
rusqlite = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-notification = "2"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whisper-rs = { version = "0.16", optional = true }
# deflate:读取 OPF 元数据(dc:title/dc:creator)需要解压条目;校验本身只读未压缩的 mimetype
zip = { version = "8", default-features = false, features = ["deflate"] }

[features]
# 语音转写(M3 T3):whisper.cpp 经 whisper-rs/cmake 编译;CI 若超时可 `--no-default-features`
default = ["voice"]
voice = ["dep:whisper-rs"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
